id: voice-agent/sms-basic-001
input: "엄마한테 잘 잔다고 문자 보내줘"
dataset: default-contacts
expected:
  tool_calls:
    mode: superset
    calls:
      - tool: search_contacts
        params:
          query: "엄마"
  output_contains_any:
    - "문자"
    - "보낼까요"
    - "보내"
  constraints:
    max_turns: 5
    max_toolcalls: 3
  llm_grader:
    rubric: response-quality.md
    min_score: 0.7
metadata:
  category: sms
  description: "기본 문자 보내기 — 연락처 검색 후 확인 질문"
  tags: [sms, basic]
