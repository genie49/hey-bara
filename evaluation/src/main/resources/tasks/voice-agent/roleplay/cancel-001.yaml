id: voice-agent/roleplay-cancel-001
type: roleplay
persona: |
  당신은 전화를 걸어달라고 요청했지만 마음이 바뀐 사용자입니다.
  확인 질문에 "아니 됐어"라고 답합니다.
goal: |
  1. 에이전트가 연락처를 검색한다
  2. 에이전트가 확인 질문을 한다
  3. 사용자가 거부한다
  4. 에이전트가 취소를 수락한다 (make_call을 호출하지 않음)
initial_message: "엄마한테 전화해줘"
dataset: default-contacts
max_turns: 6
completion_criteria:
  rubric: conversation-quality.md
  min_score: 0.7
metadata:
  category: roleplay
  description: "요청 취소 흐름"
  tags: [call, cancel, roleplay]
