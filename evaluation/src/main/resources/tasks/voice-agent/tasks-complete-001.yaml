id: voice-agent/tasks-complete-001
input: "장보기 완료"
dataset: default-contacts
expected:
  tool_calls:
    mode: superset
    calls:
      - tool: list_tasks
      - tool: complete_task
  output_contains_any:
    - "완료"
    - "장보기"
  constraints:
    max_turns: 5
    max_toolcalls: 5
  llm_grader:
    rubric: response-quality.md
    min_score: 0.7
metadata:
  category: tasks
  description: "할일 완료 — list_tasks로 ID 확인 후 complete_task 호출"
  tags: [tasks, complete, basic]
