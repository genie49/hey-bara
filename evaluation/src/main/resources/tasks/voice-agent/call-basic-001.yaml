id: voice-agent/call-basic-001
input: "엄마한테 전화해줘"
dataset: default-contacts
expected:
  tool_calls:
    mode: superset
    calls:
      - tool: search_contacts
        params:
          query: "엄마"
      - tool: make_call
        params:
          contact: "엄마"
          phoneNumber: "010-1234-5678"
  output_contains_any:
    - "전화"
    - "걸"
  constraints:
    max_turns: 5
    max_toolcalls: 3
  state_check:
    - key: "calls.last.contact"
      expect: "엄마"
    - key: "calls.last.phoneNumber"
      expect: "010-1234-5678"
  llm_grader:
    rubric: response-quality.md
    min_score: 0.7
metadata:
  category: call
  description: "기본 전화 걸기 — 연락처 1건 매칭"
  tags: [call, basic]
